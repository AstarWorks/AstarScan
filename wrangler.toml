# Cloudflare Workers Static Assets configuration.
# Deploys the Nuxt SPA as static assets via wrangler deploy.

name = "astar-scan"
compatibility_date = "2025-07-15"

# Branch previews: `wrangler versions upload --preview-alias <branch>`
# (CI preview job) is served at <alias>-astar-scan.<subdomain>.workers.dev.
preview_urls = true

[assets]
directory = "apps/web/.output/public"
